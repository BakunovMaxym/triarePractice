<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Тестування Socket.IO гри</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 5px 0;
        }

        button {
            margin-top: 10px;
        }

        #logs {
            border: 1px solid #ccc;
            padding: 10px;
            max-height: 300px;
            overflow-y: scroll;
        }

        #startGame {
            display: block;
        }

        #Game {
            display: none;

        }

        #yourTurn {
            display: none;
        }

        #OtherUsers,
        #Yourproperties,
        #propertieses {
            display: flex;
            flex-direction: row;
            column-gap: 5px;
        }

        #Yourproperties div,
        #OtherUsers div,
        #propertieses div {
            border: solid;
            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Socket.IO Тестер Гри</h1>
    <p>game Id:</p>
    <button onclick=copyGameId()> copyId </button>
    <p id="gameId"></p>
    <br>
    <p>UserId:</p>
    <button onclick=copyUserId()> copyId </button>

    <p id="UserId"></p>
    <br>
    <p>money:</p>
    <p id="money"></p>
    <br>
    <p>propertieses:</p>
    <div id="propertieses"></div>
    <br>
    <p>Yourproperties:</p>
    <div id="Yourproperties"></div>
    <br>
    <p>OtherUsers:</p>
    <div id="OtherUsers"></div>

    <div class="section">
        <h2>Підключення</h2>
        <label>
            Сервер URL:
            <input type="text" id="serverUrl" value="http://localhost:3000">
        </label>
        <button id="connectBtn">Підключитися</button>
    </div>
    <div class="section">
        <h2>отримати себе</h2>
        <button id="meBtn">Отримати я</button>
    </div>

    <div id="startGame">

        <div class="section">
            <h2>Створити гру</h2>
            <label>Ім'я користувача: <input type="text" id="createUsername"></label>
            <label>ID колекції: <input type="text" id="colectionId"></label>
            <button id="createGameBtn">Створити гру</button>
        </div>

        <div class="section">
            <h2>Приєднатися до гри</h2>
            <label>Ім'я користувача: <input type="text" id="joinUsername"></label>
            <label>ID гри: <input type="text" id="joinGameId"></label>
            <button id="joinGameBtn">Приєднатися</button>
        </div>

        <div class="section">
            <h2>Інше</h2>
            <label>ID гравця для кіка: <input type="text" id="kickPlayerId"></label>
            <button id="kickBtn">Кікнути гравця</button>
            <button id="leaveBtn">Вийти з гри</button>
        </div>
        <div class="section">
            <h2>Змінити налаштування гри</h2>
            <label>Time for Turn: <input type="number" id="timeForTurn"></label>
            <label>Money for Lap: <input type="number" id="moneyForLap"></label>
            <label>Booster Cube: <input type="checkbox" id="bosterCube"></label>
            <label>Auction Enabled: <input type="checkbox" id="auction"></label>
            <label>Starter Money: <input type="number" id="starterMoney"></label>
            <button id="changeSettingsBtn">Змінити налаштування</button>
        </div>
        <div class="section">
            <h2>старт гри</h2>
            <button id="startGameBtn">старт гри</button>
        </div>

    </div>

    <div id="Game">
        <p>TurnOrder:</p>
        <p id="TurnOrder"></p>
        <div id="YourTurn">

        </div>

    </div>

    <div class="section">
        <h2>Логи</h2>
        <div id="logs"></div>
    </div>

    <script>
        let socket;
        let latestToken = null;

        const tokenFromStorage = sessionStorage.getItem('token')
        if (tokenFromStorage) {
            latestToken = tokenFromStorage
        }

        let hasReconnectedWithToken = false;
        let game = null;
        let curentUser = null;
        function copyGameId() {
            navigator.clipboard.writeText(game.id)
        }
        function copyUserId() {
            navigator.clipboard.writeText(curentUser.id)
        }

        function updateTexts() {
            document.getElementById('gameId').textContent = '';
            document.getElementById('UserId').textContent = '';
            document.getElementById('money').textContent = '';
            document.getElementById('propertieses').textContent = '';
            document.getElementById('Yourproperties').textContent = '';
            document.getElementById('OtherUsers').textContent = '';

            if (curentUser && curentUser.id !== undefined) {
                document.getElementById('UserId').textContent = curentUser.id;
                document.getElementById('money').textContent = curentUser.money;
            }

            if (game && game.id !== undefined) {
                document.getElementById('gameId').textContent = game.id;
            }

            let usersDiv = document.getElementById('OtherUsers');
            if (usersDiv && game && Array.isArray(game.users)) {
                usersDiv.innerHTML = '';
                game.users.forEach(user => {
                    if (user && user.id !== undefined) {
                        let div = document.createElement('div');

                        let buttom = document.createElement('button')
                        buttom.textContent = "copy id"
                        buttom.addEventListener('click', () => {
                            navigator.clipboard.writeText(user.id)
                        })
                        div.appendChild(buttom)


                        let name = document.createElement('p')
                        name.textContent = "name: " + user.username
                        div.appendChild(name)

                        let money = document.createElement('p')
                        money.textContent = 'money: ' + user.money
                        div.appendChild(money)

                        let role = document.createElement('p')
                        role.textContent = 'role: ' + user.role
                        div.appendChild(role)

                        let inJail = document.createElement('p')
                        inJail.textContent = 'in jail: ' + user.inJail
                        div.appendChild(inJail)

                        let getOutOfJailCard = document.createElement('p')
                        getOutOfJailCard.textContent = 'getOutOfJail: ' + user.getOutOfJailCard
                        div.appendChild(getOutOfJailCard)

                        let JailTime = document.createElement('p')
                        JailTime.textContent = 'jailTime: ' + user.JailTime
                        div.appendChild(JailTime)

                        if (user.properties) {
                            let properties = document.createElement('ul')
                            user.properties.forEach((properti) => {
                                let li = document.createElement('li')
                                li.textContent = properti.property.name
                                properties.appendChild(li);
                            })

                            div.appendChild(properties)
                        }


                        usersDiv.appendChild(div);
                    }
                });
            }

            let turnorderText = document.getElementById('TurnOrder');
            if (turnorderText && game && Array.isArray(game.turnOrder)) {
                turnorderText.textContent = '';
                game.turnOrder.forEach(element => {
                    if (element !== undefined) {
                        turnorderText.textContent += element + ' , ';
                    }
                });
            }

            let propertDiv = document.getElementById('propertieses');
            if (propertDiv && game && Array.isArray(game.propertys)) {
                propertDiv.innerHTML = '';
                game.propertys.forEach(property => {
                    if (property && property.id !== undefined) {
                        let div = document.createElement('div');

                        let buttom = document.createElement('button')
                        buttom.textContent = "copy id"
                        buttom.addEventListener('click', () => {
                            navigator.clipboard.writeText(property.id)
                        })
                        div.appendChild(buttom)


                        let name = document.createElement('p')
                        name.textContent = "name: " + property.property.name
                        div.appendChild(name)

                        let type = document.createElement('p')
                        type.textContent = "type: " + property.property.type
                        div.appendChild(type)

                        let propertyType = document.createElement('p')
                        propertyType.textContent = "status: " + property.propertyType
                        div.appendChild(propertyType)

                        if (property.owner) {
                            let owner = document.createElement('p')
                            owner.textContent = "owner: " + property.owner.name
                            div.appendChild(owner)
                        }


                        let upgradeCount = document.createElement('p')
                        upgradeCount.textContent = "upgradeCount: " + property.upgradeCount
                        div.appendChild(upgradeCount)

                        let price = document.createElement('p')
                        price.textContent = "price: " + property.property.price
                        div.appendChild(price)

                        let street = document.createElement('p')
                        street.textContent = "street: " + property.property.street
                        div.appendChild(street)

                        let upgradePrice = document.createElement('p')
                        upgradePrice.textContent = "upgradePrice: " + property.property.upgradePrice
                        div.appendChild(upgradePrice)

                        let rent = document.createElement('p')
                        rent.textContent = "rent: " + property.property.rent
                        div.appendChild(rent)

                        let rentAllStreet = document.createElement('p')
                        rentAllStreet.textContent = "rentAllStreet: " + property.property.rentAllStreet
                        div.appendChild(rentAllStreet)

                        let rentWithOneHouse = document.createElement('p')
                        rentWithOneHouse.textContent = "rentWithOneHouse: " + property.property.rentWithOneHouse
                        div.appendChild(rentWithOneHouse)

                        let rentWithTwoHouse = document.createElement('p')
                        rentWithTwoHouse.textContent = "rentWithTwoHouse: " + property.property.rentWithTwoHouse
                        div.appendChild(rentWithTwoHouse)

                        let rentWithThreeHouse = document.createElement('p')
                        rentWithThreeHouse.textContent = "rentWithThreeHouse: " + property.property.rentWithThreeHouse
                        div.appendChild(rentWithThreeHouse)

                        let rentWithFourHouse = document.createElement('p')
                        rentWithFourHouse.textContent = "rentWithFourHouse: " + property.property.rentWithFourHouse
                        div.appendChild(rentWithFourHouse)

                        let rentWithHotel = document.createElement('p')
                        rentWithHotel.textContent = "rentWithHotel: " + property.property.rentWithHotel
                        div.appendChild(rentWithHotel)

                        propertDiv.appendChild(div);
                    }
                });
            }

            let yourpropertDiv = document.getElementById('Yourproperties');
            if (yourpropertDiv && curentUser && Array.isArray(curentUser.propertys)) {
                yourpropertDiv.innerHTML = '';
                curentUser.properties.forEach(property => {
                    if (property && property.id !== undefined) {
                        let div = document.createElement('div');

                        let buttom = document.createElement('button')
                        buttom.textContent = "copy id"
                        buttom.addEventListener('click', () => {
                            navigator.clipboard.writeText(property.id)
                        })
                        div.appendChild(buttom)


                        let name = document.createElement('p')
                        name.textContent = "name: " + property.property.name
                        div.appendChild(name)

                        let type = document.createElement('p')
                        type.textContent = "type: " + property.property.type
                        div.appendChild(type)

                        let propertyType = document.createElement('p')
                        propertyType.textContent = "status: " + property.propertyType
                        div.appendChild(propertyType)

                        if (property.owner) {
                            let owner = document.createElement('p')
                            owner.textContent = "owner: " + property.owner.name
                            div.appendChild(owner)
                        }


                        let upgradeCount = document.createElement('p')
                        upgradeCount.textContent = "upgradeCount: " + property.upgradeCount
                        div.appendChild(upgradeCount)

                        let price = document.createElement('p')
                        price.textContent = "price: " + property.property.price
                        div.appendChild(price)

                        let street = document.createElement('p')
                        street.textContent = "street: " + property.property.street
                        div.appendChild(street)

                        let upgradePrice = document.createElement('p')
                        upgradePrice.textContent = "upgradePrice: " + property.property.upgradePrice
                        div.appendChild(upgradePrice)

                        let rent = document.createElement('p')
                        rent.textContent = "rent: " + property.property.rent
                        div.appendChild(rent)

                        let rentAllStreet = document.createElement('p')
                        rentAllStreet.textContent = "rentAllStreet: " + property.property.rentAllStreet
                        div.appendChild(rentAllStreet)

                        let rentWithOneHouse = document.createElement('p')
                        rentWithOneHouse.textContent = "rentWithOneHouse: " + property.property.rentWithOneHouse
                        div.appendChild(rentWithOneHouse)

                        let rentWithTwoHouse = document.createElement('p')
                        rentWithTwoHouse.textContent = "rentWithTwoHouse: " + property.property.rentWithTwoHouse
                        div.appendChild(rentWithTwoHouse)

                        let rentWithThreeHouse = document.createElement('p')
                        rentWithThreeHouse.textContent = "rentWithThreeHouse: " + property.property.rentWithThreeHouse
                        div.appendChild(rentWithThreeHouse)

                        let rentWithFourHouse = document.createElement('p')
                        rentWithFourHouse.textContent = "rentWithFourHouse: " + property.property.rentWithFourHouse
                        div.appendChild(rentWithFourHouse)

                        let rentWithHotel = document.createElement('p')
                        rentWithHotel.textContent = "rentWithHotel: " + property.property.rentWithHotel
                        div.appendChild(rentWithHotel)

                        yourpropertDiv.appendChild(div);
                    }
                });
            }
        
            if(game.status === 'waiting_players'){
                document.getElementById('startGame').style.display = 'block';
                document.getElementById('Game').style.display = 'none';
            }
            else{
                document.getElementById('startGame').style.display = 'none';
                document.getElementById('Game').style.display = 'block';
            }
            
            
        }




        function log(message) {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.textContent = message;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', () => {
            const serverUrl = document.getElementById('serverUrl').value;
            socket = io(serverUrl, { transports: ['websocket'] });
            if (latestToken) {
                socket.auth = { token: latestToken };  // Wrap in an object!
                socket.disconnect().connect();
                hasReconnectedWithToken = true;
                socket.emit('me')
            }
            socket.on('connect', () => log('Підключено до сервера'));
            socket.on('disconnect', () => log('Відключено від сервера'));

            socket.on('roomJoined', data => {
                log('roomJoined: ' + JSON.stringify(data));
                if (data.token && data.token.accessToken) {
                    latestToken = data.token.accessToken;
                    sessionStorage.setItem('token', latestToken)
                }
                if (!hasReconnectedWithToken) {
                    log('👉 Setting auth with token: ' + latestToken);
                    hasReconnectedWithToken = true;
                    socket.auth = { token: latestToken };  // Wrap in an object!
                    socket.disconnect().connect();
                    log('🔄 Reconnecting with token...');
                }
                curentUser = data.user
                updateTexts()

            });
            socket.on('gameCreated', data => {
                log('gameCreated: ' + JSON.stringify(data))
                game = data;
                updateTexts()


            });
            socket.on('userJoined', data => {
                log('userJoined: ' + JSON.stringify(data))
                game = data.curentGame;
                console.log(data)
                updateTexts()

            });
            socket.on('userLeft', data => {
                log('userLeft: ' + JSON.stringify(data));
                game.users = game.users.filter((user) => user.id !== data);
                updateTexts()
            });
            socket.on('Kicked', data => {
                log('Kicked: ' + data)
                game.users = game.users.filter((user) => user.id !== data);
                if (curentUser.id === data) {
                    latestToken = null;
                    hasReconnectedWithToken = false;
                    game = null;
                    curentUser = null;
                }
                updateTexts()
            });
            socket.on('Leave', data => {
                log('Leave: ' + data);
                socket.disconnect();
                latestToken = null;
                hasReconnectedWithToken = false;
                game = null;
                curentUser = null;
                updateTexts()


            });
            socket.on('error', data => {
                log('Error: ' + data.description)
                alert(data.description)
            });
            socket.on('kaput', data => {
                log('KAPUT: ❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌')
                socket.disconnect();
                latestToken = null;
                hasReconnectedWithToken = false;
                game = null;
                curentUser = null;
                updateTexts()
            });

            socket.on('settingsChanged', data => {
                log('settingsChanged: ' + JSON.stringify(data))
                game.colection = data;
            });
            socket.on('gameStarted', data => {
                log('gameStarted: ' + JSON.stringify(data))
                game = data;
                updateTexts()
                socket.emit('me')



                
            });

            socket.on('you', data => {
                log('you: ' + JSON.stringify(data))
                curentUser = data;
                game = data.game;
                updateTexts()
            });

            socket.on('userpasive', data => log('userpasive: ' + data));
            socket.on('useractive', data => log('useractive: ' + data));


        });


        document.getElementById('createGameBtn').addEventListener('click', () => {
            const username = document.getElementById('createUsername').value;
            const colectionId = document.getElementById('colectionId').value;
            const payload = { username, colectionId };
            socket.emit('createGame', payload);
            log('Sent createGame: ' + JSON.stringify(payload));
        });

        document.getElementById('joinGameBtn').addEventListener('click', () => {
            const username = document.getElementById('joinUsername').value;
            const gameId = document.getElementById('joinGameId').value;
            const payload = { username, gameId };
            socket.emit('joinGame', payload);
            log('Sent joinGame: ' + JSON.stringify(payload));
        });

        document.getElementById('kickBtn').addEventListener('click', () => {
            const playerId = document.getElementById('kickPlayerId').value;
            const payload = { playerId };
            socket.emit('kickFromGame', payload);
            log('Sent kickFromGame: ' + JSON.stringify(payload));
        });

        document.getElementById('leaveBtn').addEventListener('click', () => {
            socket.emit('leaveGame');
            log('Sent leaveGame');
        });

        document.getElementById('changeSettingsBtn').addEventListener('click', () => {
            const payload = {
                timeForturn: parseInt(document.getElementById('timeForTurn').value),
                moneyForLap: parseInt(document.getElementById('moneyForLap').value),
                bostercube: document.getElementById('bosterCube').checked,
                auction: document.getElementById('auction').checked,
                starterMoney: parseInt(document.getElementById('starterMoney').value)
            };
            socket.emit('changeSettings', payload);
            log('Sent changeSettings: ' + JSON.stringify(payload));
        });


        document.getElementById('startGameBtn').addEventListener('click', () => {

            socket.emit('startGame');
            log('Sent startGame: ');
        });

        document.getElementById('meBtn').addEventListener('click', () => {

            socket.emit('me');


            log('me: ');
        });
    </script>

</body>

</html>
