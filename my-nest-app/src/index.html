<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Тестування Socket.IO гри</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 5px 0;
        }

        button {
            margin-top: 10px;
        }

        #logs {
            border: 1px solid #ccc;
            padding: 10px;
            max-height: 300px;
            overflow-y: scroll;
        }

        #startGame {
            visibility: hidden;
        }

        #game {
            visibility: hidden;
        }

        #yourTurn {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <h1>Socket.IO Тестер Гри</h1>
    <p id="gameId"></p>
    <p id="UserId"></p>

    <p id="money"></p>
    <p id="propertieses"></p>
    <p id="Yourproperties"></p>

    <p id="OtherUsers"></p>


    <div class="section">
        <h2>Підключення</h2>
        <label>
            Сервер URL:
            <input type="text" id="serverUrl" value="http://localhost:3000">
        </label>
        <button id="connectBtn">Підключитися</button>
    </div>
    <div class="section">
        <h2>отримати себе</h2>
        <button id="meBtn">Отримати я</button>
    </div>

    <div id="startGame">

        <div class="section">
            <h2>Створити гру</h2>
            <label>Ім'я користувача: <input type="text" id="createUsername"></label>
            <label>ID колекції: <input type="text" id="colectionId"></label>
            <button id="createGameBtn">Створити гру</button>
        </div>

        <div class="section">
            <h2>Приєднатися до гри</h2>
            <label>Ім'я користувача: <input type="text" id="joinUsername"></label>
            <label>ID гри: <input type="text" id="joinGameId"></label>
            <button id="joinGameBtn">Приєднатися</button>
        </div>

        <div class="section">
            <h2>Інше</h2>
            <label>ID гравця для кіка: <input type="text" id="kickPlayerId"></label>
            <button id="kickBtn">Кікнути гравця</button>
            <button id="leaveBtn">Вийти з гри</button>
        </div>
        <div class="section">
            <h2>Змінити налаштування гри</h2>
            <label>Time for Turn: <input type="number" id="timeForTurn"></label>
            <label>Money for Lap: <input type="number" id="moneyForLap"></label>
            <label>Booster Cube: <input type="checkbox" id="bosterCube"></label>
            <label>Auction Enabled: <input type="checkbox" id="auction"></label>
            <label>Starter Money: <input type="number" id="starterMoney"></label>
            <button id="changeSettingsBtn">Змінити налаштування</button>
        </div>
        <div class="section">
            <h2>старт гри</h2>

            <button id="startGameBtn">старт гри</button>
        </div>

    </div>

    <div>

    </div>

    <div class="section">
        <h2>Логи</h2>
        <div id="logs"></div>
    </div>

    <script>
        let socket;
        let latestToken = null;
        let hasReconnectedWithToken = false;

        let game = null;
        let curentUser = null;



        function log(message) {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.textContent = message;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', () => {
            const serverUrl = document.getElementById('serverUrl').value;
            socket = io(serverUrl, { transports: ['websocket'] });

            socket.on('connect', () => log('Підключено до сервера'));
            socket.on('disconnect', () => log('Відключено від сервера'));

            socket.on('roomJoined', data => {
                log('roomJoined: ' + JSON.stringify(data));
                if (data.token && data.token.accessToken) {
                    latestToken = data.token.accessToken;
                }
                if (!hasReconnectedWithToken) {
                    log('👉 Setting auth with token: ' + latestToken);
                    hasReconnectedWithToken = true;
                    socket.auth = { token: latestToken };  // Wrap in an object!
                    socket.disconnect().connect();
                    log('🔄 Reconnecting with token...');
                }
                curentUser = data.user.id
            });
            socket.on('gameCreated', data => {
                log('gameCreated: ' + JSON.stringify(data))
                game = data;
                document.getElementById('gameId').textContent = game.id;
                let propertiesText = document.getElementById('propertieses');
                game.propertys.forEach(element => {
                    propertiesText.textContent += element.property.id + ' , ';
                });

            });
            socket.on('userJoined', data => {
                log('userJoined: ' + JSON.stringify(data))
                game = data.curentGame;
                let usersText = document.getElementById('OtherUsers');
                data.curentGame.users.forEach(element => {
                    propertiesText.usersText += element.id + ' , ';
                });
            });
            socket.on('userLeft', data => {
                log('userLeft: ' + JSON.stringify(data));
                game.users = game.users.filter((user) => user.id !== data);
                let usersText = document.getElementById('OtherUsers');
                usersText.textContent = '';
                game.users.forEach(element => {
                    usersText.usersText += element.id + ' , ';
                });
            });
            socket.on('Kicked', data => {
                log('Kicked: ' + data)
                game.users = game.users.filter((user) => user.id !== data);
                let usersText = document.getElementById('OtherUsers');
                usersText.textContent = '';
                game.users.forEach(element => {
                    usersText.usersText += element.id + ' , ';
                });
            });
            socket.on('Leave', data => log('Leave: ' + data));
            socket.on('error', data => log('Error: ' + data.description));
            socket.on('hello', data => log('hello: ' + data));
            socket.on('userpasive', data => log('userpasive: ' + data));
            socket.on('useractive', data => log('useractive: ' + data));
            socket.on('kaput', data => log('KAPUT: ❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌'));
            socket.on('settingsChanged', data => log('settingsChanged: ' + JSON.stringify(data)));
            socket.on('gameStarted', data => log('gameStarted: ' + JSON.stringify(data)));
            socket.on('you', data => log('you: ' + JSON.stringify(data)));



        });

        document.getElementById('createGameBtn').addEventListener('click', () => {
            const username = document.getElementById('createUsername').value;
            const colectionId = document.getElementById('colectionId').value;
            const payload = { username, colectionId };
            socket.emit('createGame', payload);
            log('Sent createGame: ' + JSON.stringify(payload));
        });

        document.getElementById('joinGameBtn').addEventListener('click', () => {
            const username = document.getElementById('joinUsername').value;
            const gameId = document.getElementById('joinGameId').value;
            const payload = { username, gameId };
            socket.emit('joinGame', payload);
            log('Sent joinGame: ' + JSON.stringify(payload));
        });

        document.getElementById('kickBtn').addEventListener('click', () => {
            const playerId = document.getElementById('kickPlayerId').value;
            const payload = { playerId };
            socket.emit('kickFromGame', payload);
            log('Sent kickFromGame: ' + JSON.stringify(payload));
        });

        document.getElementById('leaveBtn').addEventListener('click', () => {
            socket.emit('leaveGame');
            log('Sent leaveGame');
        });

        document.getElementById('changeSettingsBtn').addEventListener('click', () => {
            const payload = {
                timeForturn: parseInt(document.getElementById('timeForTurn').value),
                moneyForLap: parseInt(document.getElementById('moneyForLap').value),
                bostercube: document.getElementById('bosterCube').checked,
                auction: document.getElementById('auction').checked,
                starterMoney: parseInt(document.getElementById('starterMoney').value)
            };
            socket.emit('changeSettings', payload);
            log('Sent changeSettings: ' + JSON.stringify(payload));
        });


        document.getElementById('startGameBtn').addEventListener('click', () => {

            socket.emit('startGame');
            log('Sent startGame: ');
        });

        document.getElementById('meBtn').addEventListener('click', () => {

            socket.emit('me');
            log('me: ');
        });
    </script>

</body>

</html>
